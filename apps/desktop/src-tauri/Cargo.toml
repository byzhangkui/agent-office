[package]
name = "agent-office"
version = "0.1.0"
description = "Animated local office for agent activity"
authors = ["Agent Office Contributors"]
edition = "2021"

[lib]
name = "agent_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agent-office"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
